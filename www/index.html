<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B5FFF">
  <title>CorridaBR</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="lib/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login / cadastro -->
  <main id="auth" class="auth hidden">
    <div class="auth-card">
      <div class="logo">BR<span>Corrida</span></div>
      <p class="tag">Sua corrida, rápida e segura.</p>
      <div class="tabs">
        <button type="button" id="tab-login" class="tab on">Entrar</button>
        <button type="button" id="tab-register" class="tab">Criar conta</button>
      </div>
      <form id="f-login" autocomplete="on">
        <input name="phone" type="tel" inputmode="tel" placeholder="Telefone com DDD" autocomplete="tel" required>
        <input name="password" type="password" placeholder="Senha" autocomplete="current-password" required>
        <button class="btn big" type="submit">Entrar</button>
      </form>
      <form id="f-register" class="hidden" autocomplete="on">
        <input name="name" type="text" placeholder="Seu nome completo" autocomplete="name" required minlength="2">
        <input name="phone" type="tel" inputmode="tel" placeholder="Telefone com DDD" autocomplete="tel" required>
        <input name="password" type="password" placeholder="Crie uma senha (mín. 6 caracteres)" autocomplete="new-password" required minlength="6">
        <button class="btn big" type="submit">Criar conta</button>
      </form>
      <p id="auth-error" class="error"></p>
    </div>
  </main>

  <!-- App -->
  <div id="app" class="hidden">
    <div id="map"></div>
    <button id="btn-menu" class="fab fab-menu" aria-label="Menu">☰</button>
    <button id="btn-locate" class="fab fab-locate" aria-label="Minha localização">◎</button>
    <section id="sheet" class="sheet"></section>

    <div id="menu" class="menu hidden">
      <div class="menu-panel">
        <div class="menu-head">
          <b>Meu perfil</b>
          <button id="menu-close" class="link">Fechar</button>
        </div>
        <section id="tab-profile" class="menu-section">
        <div class="prof">
          <div id="prof-avatar" class="prof-photo"></div>
          <div class="grow">
            <div class="muted" id="prof-rating"></div>
            <div class="muted" id="prof-phone"></div>
            <button id="btn-photo" class="link" type="button">📷 Trocar foto</button>
          </div>
        </div>
        <input id="photo-input" type="file" accept="image/*" class="hidden">
        <form id="f-name" class="name-row">
          <input id="prof-name" type="text" minlength="2" maxlength="60" required autocomplete="name">
          <button class="btn" type="submit">Salvar</button>
        </form>
        </section>
        <section id="tab-rides" class="menu-section hidden">
        <h3>Suas corridas</h3>
        <ul id="history" class="history"></ul>
        </section>
        <button id="btn-logout" class="btn ghost">Sair da conta</button>
      </div>
    </div>
    <nav class="bottom-nav" aria-label="Navegação principal">
      <button type="button" data-menu-tab="profile" class="active"><span>👤</span>Perfil</button>
      <button type="button" data-menu-tab="rides"><span>🧾</span>Corridas</button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="lib/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
